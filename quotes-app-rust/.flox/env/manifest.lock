    "options": {},
    "build": {
      "quotes-app-rust": {
        "command": "  mkdir -p $out/bin\n  cargo build --release\n  cp target/release/quotes-app-rust $out/bin/quotes-app-rust\n",
        "runtime-packages": [
          "libiconv",
          "gcc"
        ],
        "version": "0.1.0",
        "description": "A simple quotes server"
      },
      "quotes-app-rust-deps": {
        "command": "  mkdir -p $out/etc\n  cargo vendor $out/etc/vendor\n",
        "description": "Vendored dependencies for the quotes server"
      },
      "quotes-app-rust-pure": {
        "command": "  # Tell cargo to use the vendored dependencies\n  mkdir -p .cargo\n  cat <<-'EOF' > .cargo/vendor-config.toml\n  [source.crates-io]\n  replace-with = \"vendored-sources\"\n\n  [source.vendored-sources]\n  directory = \"${quotes-app-rust-deps}/etc/vendor\"\nEOF\n\n  # Perform the build\n  mkdir -p $out/bin\n  cargo build --release --offline --config .cargo/vendor-config.toml\n  cp target/release/quotes-app-rust $out/bin/quotes-app-rust-pure\n",
        "runtime-packages": [
          "libiconv",
          "gcc"
        ],
        "sandbox": "pure",
        "version": "0.1.0",
        "description": "A simple quotes server"
      }
    }
  },
