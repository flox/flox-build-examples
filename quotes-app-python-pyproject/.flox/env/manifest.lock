        "pkg-path": "zlib",
        "systems": [
          "aarch64-linux",
          "x86_64-linux"
        ]
      }
    },
    "hook": {
      "on-activate": "  # uv must use the manifest's interpreter, never a uv-managed download: both vars are needed.\n  export UV_PYTHON_DOWNLOADS=never UV_PYTHON_PREFERENCE=only-system\n  export UV_PROJECT_ENVIRONMENT=\"$FLOX_ENV_CACHE/venv\"\n  [ -x \"$UV_PROJECT_ENVIRONMENT/bin/python\" ] || uv venv --python \"$FLOX_ENV/bin/python3\" \"$UV_PROJECT_ENVIRONMENT\"\n  export VIRTUAL_ENV=\"$UV_PROJECT_ENVIRONMENT\"\n  uv pip install -e .\n  # [profile] is sourced only by interactive shells; `flox activate -- cmd` needs this too.\n  export PATH=\"$VIRTUAL_ENV/bin:$PATH\"\n"
    },
    "profile": {
      "bash": "source \"$FLOX_ENV_CACHE/venv/bin/activate\"",
      "zsh": "source \"$FLOX_ENV_CACHE/venv/bin/activate\""
    },
    "options": {
      "systems": [
        "aarch64-darwin",
        "x86_64-darwin",
        "aarch64-linux",
        "x86_64-linux"
      ]
    },
    "build": {
      "quotes-app-python-pyproject": {
        "command": "  export UV_PYTHON_DOWNLOADS=never UV_PYTHON_PREFERENCE=only-system UV_LINK_MODE=copy\n  uv venv --python \"$FLOX_ENV/bin/python3\" \"$out\"\n  export VIRTUAL_ENV=\"$out\" UV_PROJECT_ENVIRONMENT=\"$out\"\n  uv pip install .\n  if [ \"$(uname)\" = Linux ]; then\n    auto-patchelf --paths \"$out/lib\" --libs \"$FLOX_ENV/lib\"\n  fi\n",
        "runtime-packages": [
          "python3",
          "gcc-unwrapped",
          "zlib"
        ],
        "version": "0.1.0"
      }
    }
  },
