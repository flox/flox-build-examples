          "x86_64-linux"
        ]
      }
    },
    "hook": {
      "on-activate": "  # Poetry owns the dev venv (poetry.lock is the source of truth). It cannot be told the\n  # venv's path, only its parent, so keep it under the env cache and let poetry name it.\n  export POETRY_VIRTUALENVS_PATH=\"$FLOX_ENV_CACHE/poetry\" POETRY_VIRTUALENVS_IN_PROJECT=false\n  # The nixpkgs poetry wrapper puts its own python (3.13) first on PATH; pin the venv to\n  # the manifest's interpreter or `poetry env activate` cannot find it.\n  poetry env use --quiet \"$FLOX_ENV/bin/python3\"\n  poetry install --quiet --no-interaction\n  # [profile] is sourced only by interactive shells; `flox activate -- cmd` needs this too.\n  export VIRTUAL_ENV=\"$(poetry env info --path)\"\n  export PATH=\"$VIRTUAL_ENV/bin:$PATH\"\n"
    },
    "profile": {
      "bash": "eval \"$(poetry env activate)\"",
      "zsh": "eval \"$(poetry env activate)\""
    },
    "options": {
      "systems": [
        "aarch64-darwin",
        "x86_64-darwin",
        "aarch64-linux",
        "x86_64-linux"
      ]
    },
    "build": {
      "quotes-app-python-poetry": {
        "command": "  export UV_PYTHON_DOWNLOADS=never UV_PYTHON_PREFERENCE=only-system UV_LINK_MODE=copy\n  uv venv --python \"$FLOX_ENV/bin/python3\" \"$out\"\n  export VIRTUAL_ENV=\"$out\" UV_PROJECT_ENVIRONMENT=\"$out\"\n  # poetry installs exactly poetry.lock into $out. It honours VIRTUAL_ENV only when it has\n  # no envs.toml record for this project and no in-project .venv, so neutralise both.\n  export POETRY_VIRTUALENVS_PATH=\"$out\" POETRY_VIRTUALENVS_IN_PROJECT=false\n  poetry install --only main --no-root --no-interaction\n  uv pip install --no-deps .\n  if [ \"$(uname)\" = Linux ]; then\n    auto-patchelf --paths \"$out/lib\" --libs \"$FLOX_ENV/lib\"\n  fi\n",
        "runtime-packages": [
          "python3",
          "gcc-unwrapped",
          "zlib"
        ],
        "version": "0.1.0"
      }
    }
  },
