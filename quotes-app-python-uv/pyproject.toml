[project]
name = "quotes-app-python-uv"
version = "0.1.0"
description = "Quotes server: uv.lock, no console script, uvicorn launcher"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "numpy",
]

# `uv sync --no-editable` only installs the project itself when it has a build backend.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quotes_app"]
